name: gate
on:
  pull_request:
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: gate (code taken from the base branch only)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init -q w && cd w
          git fetch -q --no-tags "https://github.com/${GITHUB_REPOSITORY}" "+refs/heads/main:refs/remotes/origin/main" "+refs/pull/${PR_NUM}/head:refs/remotes/pr/head"
          git cat-file -e "${BASE_SHA}^{commit}"
          git show "${BASE_SHA}:gate/gate.py" > "${RUNNER_TEMP}/gate.py"
          GATE_WORK="$PWD" python3 "${RUNNER_TEMP}/gate.py"
