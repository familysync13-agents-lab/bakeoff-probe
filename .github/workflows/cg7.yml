name: cg7
# PROBE REPOSITORY ONLY. Proves (CG-7) that the Actions GITHUB_TOKEN (1) is read-only by default and (2) cannot approve a pull
# request even when a job explicitly requests pull-requests: write. Each job SUCCEEDS only if GitHub REFUSES the attempt.
on:
  pull_request:
    branches: [main]
# no workflow-level permissions: job 1 deliberately receives the ORGANIZATION DEFAULT token permissions
jobs:
  cg7-default-token-read-only:
    if: startsWith(github.head_ref, 'cg7/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: attempt a write with the default-permission token (must be refused)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" -d "{\"ref\":\"refs/heads/cg7-forged-${GITHUB_RUN_ID}\",\"sha\":\"${SHA}\"}")
          echo "::notice title=cg7-default-write::HTTP ${code}"
          [ "$code" = 403 ] || [ "$code" = 404 ]
  cg7-actions-cannot-approve:
    if: startsWith(github.head_ref, 'cg7/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: attempt to approve the pull request with the Actions token (must be refused)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -u
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" -d '{"event":"APPROVE","body":"cg7 forged approval"}')
          echo "::notice title=cg7-approve::HTTP ${code} $(head -c 200 /tmp/r.json | tr -d '\n')"
          [ "$code" = 422 ] || [ "$code" = 403 ]
